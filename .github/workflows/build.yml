name: Build + Push + Cosign

on:
  schedule:
    - cron: "30 2 * * 1"      # Mondays 02:30 UTC
  push:
    branches: [ "master", "ci/container-build-push-cosign" ]
    tags: [ 'v*.*.*' ]
  workflow_dispatch: {}

permissions:
  contents: read
  packages: write
  id-token: write   # for cosign

env:
  IMAGE: ghcr.io/${{ github.repository }}

jobs:
  build:
    runs-on: ubuntu-latest
    outputs:
      ecr-image: ${{ steps.ecr-push.outputs.image }}

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Docker meta (tags + labels)
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=ref,event=branch
            type=ref,event=tag
            type=sha
            type=raw,value=latest,enable={{is_default_branch}}
          labels: |
            org.opencontainers.image.authors=${{ github.repository_owner }}
            org.opencontainers.image.vendor=${{ github.repository_owner }}
            org.opencontainers.image.licenses=${{ github.event.repository.license.spdx_id }}
            org.opencontainers.image.title=${{ github.event.repository.name }}
            org.opencontainers.image.documentation=https://github.com/${{ github.repository }}#readme
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.description=Middleware and alternative web GUI to access Maconomy
            org.opencontainers.image.revision={{sha}}
            org.opencontainers.image.created={{commit_date 'YYYY-MM-DDTHH:mm:ss[Z]'}}

      - name: Build image
        id: buildah
        uses: redhat-actions/buildah-build@v2
        with:
          image: ${{ env.IMAGE }}
          tags: ${{ steps.meta.outputs.tags }}
          containerfiles: |
            ./Dockerfile
          labels: ${{ steps.meta.outputs.labels }}

      - name: Log in to registry
        uses: redhat-actions/podman-login@v1
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Push to registry
        id: push
        uses: redhat-actions/push-to-registry@v2
        with:
          image: ${{ steps.buildah.outputs.image }}
          tags: ${{ steps.buildah.outputs.tags }}
          registry: ghcr.io

      - name: Install cosign
        if: github.event_name != 'pull_request'
        uses: sigstore/cosign-installer@v4.1.2
        with:
          cosign-release: 'v3.0.6'

      - name: Sign image
        if: github.event_name != 'pull_request'
        env:
          DIGEST: ${{ steps.push.outputs.digest }}
        run: |
          cosign sign --yes ${{ env.IMAGE }}@${DIGEST}

      # --- Amazon ECR -------------------------------------------------------
      # The image built above is promoted to ECR by digest, so the artifact
      # deployed to ECS is bit-for-bit the one that was built and signed.

      - name: Configure AWS credentials
        if: github.event_name != 'schedule'
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}

      - name: Log in to Amazon ECR
        if: github.event_name != 'schedule'
        id: ecr-login
        run: |
          registry="$(aws sts get-caller-identity --query Account --output text).dkr.ecr.${{ vars.AWS_REGION }}.amazonaws.com"
          aws ecr get-login-password --region "${{ vars.AWS_REGION }}" \
            | podman login --username AWS --password-stdin "$registry"
          echo "registry=$registry" >> "$GITHUB_OUTPUT"

      - name: Push to Amazon ECR
        if: github.event_name != 'schedule'
        id: ecr-push
        env:
          DIGEST: ${{ steps.push.outputs.digest }}
          REGISTRY: ${{ steps.ecr-login.outputs.registry }}
          REPOSITORY: micronomy
        run: |
          set -euo pipefail
          target="${REGISTRY}/${REPOSITORY}:${GITHUB_SHA}"

          podman pull "${{ env.IMAGE }}@${DIGEST}"
          podman tag "${{ env.IMAGE }}@${DIGEST}" "$target"
          podman push "$target"

          if [ "${{ github.ref }}" = "refs/heads/${{ github.event.repository.default_branch }}" ]; then
            podman tag "$target" "${REGISTRY}/${REPOSITORY}:latest"
            podman push "${REGISTRY}/${REPOSITORY}:latest"
          fi

          echo "image=$target" >> "$GITHUB_OUTPUT"
          echo "Pushed $target" >> "$GITHUB_STEP_SUMMARY"

  deploy:
    name: Deploy to ECS
    needs: build
    runs-on: ubuntu-latest
    # Only promote to the running environment from the default branch, a
    # release tag, or a manual run - not from the weekly rebuild or topic
    # branches.
    if: >-
      github.event_name == 'workflow_dispatch' ||
      github.ref == format('refs/heads/{0}', github.event.repository.default_branch) ||
      startsWith(github.ref, 'refs/tags/v')

    # Add required reviewers to this environment in the repository settings
    # to turn the deployment into a manually approved step.
    environment:
      name: production
      url: https://micronomy.init.se/

    permissions:
      contents: read
      id-token: write

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}

      - name: Render task definition with the new image
        id: taskdef
        uses: aws-actions/amazon-ecs-render-task-definition@v1
        with:
          task-definition: deploy/aws-task-definition.json
          container-name: micronomy
          image: ${{ needs.build.outputs.ecr-image }}

      - name: Deploy to Amazon ECS
        uses: aws-actions/amazon-ecs-deploy-task-definition@v2
        with:
          task-definition: ${{ steps.taskdef.outputs.task-definition }}
          cluster: ${{ vars.ECS_CLUSTER }}
          service: ${{ vars.ECS_SERVICE }}
          # Block until the new tasks are healthy and the old ones are gone,
          # so a failing deployment fails the workflow instead of passing
          # silently while ECS rolls back.
          wait-for-service-stability: true
          wait-for-minutes: 10

      - name: Summarise
        run: |
          echo "Deployed \`${{ needs.build.outputs.ecr-image }}\` to ${{ vars.ECS_SERVICE }} on ${{ vars.ECS_CLUSTER }}." \
            >> "$GITHUB_STEP_SUMMARY"
